apiVersion: batch/v1
kind: Job
metadata:
  name: sid-dbbench-rtx6000-bandit
  namespace: seelab
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        nvidia.com/gpu.product: Quadro-RTX-6000
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "password"
          ports:
            - containerPort: 3306
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "2Gi"

        - name: bench
          image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-runtime
          resources:
            requests:
              cpu: "8"
              memory: "24Gi"
              ephemeral-storage: "12Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "9"
              memory: "28Gi"
              ephemeral-storage: "20Gi"
              nvidia.com/gpu: "1"
          env:
            - name: DBBENCH_MYSQL_HOST
              value: "127.0.0.1"
            - name: DBBENCH_MYSQL_PORT
              value: "3306"
            - name: DBBENCH_MYSQL_PASSWORD
              value: "password"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: LAB_RUN_SEED
              value: "42"
            - name: DBBENCH_BANDIT_ALPHA
              value: "0.5"
            - name: DBBENCH_BANDIT_LAMBDA
              value: "0.3"
            - name: DBBENCH_BANDIT_BUDGET_TARGET
              value: "0.00009"
            - name: DBBENCH_BANDIT_LAMBDA_LR
              value: "0.05"
            - name: DBBENCH_BANDIT_ADAPTIVE_LAMBDA
              value: "1"
            - name: DBBENCH_BANDIT_TWO_HEAD
              value: "1"
            - name: DBBENCH_BANDIT_POLICY
              value: "utility"
            - name: DBBENCH_BANDIT_CORRECTNESS_THRESHOLD
              value: "0.70"
            - name: DBBENCH_BANDIT_ADAPTIVE_THRESHOLD
              value: "1"
            - name: DBBENCH_BANDIT_TARGET_ACCURACY
              value: "0.6867"
            - name: DBBENCH_BANDIT_ACCURACY_TOL
              value: "0.01"
            - name: DBBENCH_BANDIT_THRESHOLD_STEP
              value: "0.005"
            - name: DBBENCH_BANDIT_THRESHOLD_MIN
              value: "0.55"
            - name: DBBENCH_BANDIT_THRESHOLD_MAX
              value: "0.90"
            - name: DBBENCH_BANDIT_COST_EMA_DECAY
              value: "0.9"
            - name: DBBENCH_BANDIT_COST_GUARDRAIL_ENABLE
              value: "1"
            - name: DBBENCH_BANDIT_COST_GUARDRAIL_BAND
              value: "0.10"
            - name: DBBENCH_BANDIT_COST_GUARDRAIL_DECAY
              value: "0.95"
            - name: DBBENCH_BANDIT_ALLOW_MAX_ARM
              value: "0"
            - name: DBBENCH_BANDIT_RESCUE_ENABLE
              value: "0"
            - name: HF_HOME
              value: "/work/.cache/huggingface"
            - name: TRANSFORMERS_CACHE
              value: "/work/.cache/huggingface"
            - name: XDG_CACHE_HOME
              value: "/work/.cache"
            - name: TMPDIR
              value: "/work/tmp"
          volumeMounts:
            - name: bench-storage
              mountPath: /work
            - name: dshm
              mountPath: /dev/shm
          workingDir: /work/LifelongAgentBench
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              source /opt/conda/etc/profile.d/conda.sh
              conda activate /work/conda-py311
              python3 - <<'PY'
              import os, socket, time, sys
              host = os.getenv("DBBENCH_MYSQL_HOST", "127.0.0.1")
              port = int(os.getenv("DBBENCH_MYSQL_PORT", "3306"))
              for _ in range(180):
                  s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  s.settimeout(1.0)
                  try:
                      s.connect((host, port))
                      s.close()
                      sys.exit(0)
                  except Exception:
                      time.sleep(1)
                  finally:
                      try:
                          s.close()
                      except Exception:
                          pass
              raise SystemExit("MySQL did not become reachable in time")
              PY
              python3 - <<'PY'
              import json
              import os
              from src.factories.chat_history_item.offline.task_requirement import TASK_REQUIREMENT_DICT
              from src.typings import TaskName
              path = "chat_history_items/standard/db_bench.json"
              os.makedirs(os.path.dirname(path), exist_ok=True)
              payload = {
                  "value": {
                      "0": {"role": "user", "content": TASK_REQUIREMENT_DICT[TaskName.DB_BENCH]},
                      "1": {"role": "agent", "content": ""},
                  }
              }
              with open(path, "w") as f:
                  json.dump(payload, f, indent=2)
              PY
              set +e
              python3 -m src.run_experiment \
                --config_path configs/assignments/experiments/qwen25_7b_instruct/instance/db_bench/instance/fast_subsample_150.yaml \
                --enable_dbbench_bandit \
                --bandit_alpha ${DBBENCH_BANDIT_ALPHA} \
                --bandit_lambda ${DBBENCH_BANDIT_LAMBDA} \
                --bandit_budget_target ${DBBENCH_BANDIT_BUDGET_TARGET} \
                --bandit_lambda_lr ${DBBENCH_BANDIT_LAMBDA_LR} \
                --bandit_adaptive_lambda \
                --bandit_two_head \
                --bandit_policy ${DBBENCH_BANDIT_POLICY} \
                --bandit_correctness_threshold ${DBBENCH_BANDIT_CORRECTNESS_THRESHOLD} \
                --bandit_adaptive_threshold \
                --bandit_target_accuracy ${DBBENCH_BANDIT_TARGET_ACCURACY} \
                --bandit_accuracy_tolerance ${DBBENCH_BANDIT_ACCURACY_TOL} \
                --bandit_threshold_step ${DBBENCH_BANDIT_THRESHOLD_STEP} \
                --bandit_threshold_min ${DBBENCH_BANDIT_THRESHOLD_MIN} \
                --bandit_threshold_max ${DBBENCH_BANDIT_THRESHOLD_MAX} \
                --bandit_cost_ema_decay ${DBBENCH_BANDIT_COST_EMA_DECAY} \
                --bandit_cost_guardrail_enable \
                --bandit_cost_guardrail_band ${DBBENCH_BANDIT_COST_GUARDRAIL_BAND} \
                --bandit_cost_guardrail_decay ${DBBENCH_BANDIT_COST_GUARDRAIL_DECAY} \
                --seed ${LAB_RUN_SEED}
              EXIT_CODE=$?
              set -e
              RUN_DIR="$(ls -dt outputs/* 2>/dev/null | head -n1 || true)"
              if [ -n "${RUN_DIR}" ]; then
                mkdir -p /work/results_archive
                cp -r "${RUN_DIR}" /work/results_archive/
              fi
              exit ${EXIT_CODE}
      volumes:
        - name: bench-storage
          persistentVolumeClaim:
            claimName: sid-bench-rwo
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
