import:
  - ../task.yaml
  - ../../../agent.yaml
  - ../../../../../../definition.yaml

assignment_config:
  callback_dict:
    callback_0:
      name: current_session_saving_callback
    callback_1:
      name: consecutive_abnormal_agent_inference_process_handling_callback
    callback_2:
      name: cost_print_callback
  output_dir: outputs/{TIMESTAMP}
  sample_order: default
  agent:
    custom_parameters:
      language_model: Qwen2.5-7B-Instruct
      inference_config_dict:
        do_sample: false
        num_beams: 1
        max_new_tokens: 256
        temperature: null
        top_k: null
        top_p: null

environment_config:
  use_task_client_flag: false

language_model_dict:
  Qwen2.5-7B-Instruct:
    parameters:
      dtype: "float16"
      device_map: "cuda:0"
